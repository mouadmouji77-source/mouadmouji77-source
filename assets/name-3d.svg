<svg width="760" height="150" viewBox="0 0 760 150" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="frontGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee2ff"/>
      <stop offset="55%" stop-color="#3aa0ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="-0.3" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.3;1.3" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.1;1.7" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- flat intro line -->
  <text x="380" y="34" font-size="22" fill="#8b949e" text-anchor="middle">Hi, I'm</text>
  <text x="300" y="30" font-size="24" text-anchor="middle" transform-origin="300px 24px">
    👋
    <animateTransform attributeName="transform" type="rotate" values="0;20;-12;20;0" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- extruded 3D name: stacked copies create the depth, gradient cap on top -->
  <g filter="url(#softShadow)">
    <g id="extrude" fill="#08213f" font-size="58" font-weight="800" text-anchor="middle">
      <text x="384.8" y="126.8">Mouad Mouji</text>
      <text x="384.4" y="126.4">Mouad Mouji</text>
      <text x="384.0" y="126.0">Mouad Mouji</text>
      <text x="383.6" y="125.6">Mouad Mouji</text>
      <text x="383.2" y="125.2">Mouad Mouji</text>
      <text x="382.8" y="124.8">Mouad Mouji</text>
      <text x="382.4" y="124.4">Mouad Mouji</text>
      <text x="382.0" y="124.0">Mouad Mouji</text>
      <text x="381.6" y="123.6">Mouad Mouji</text>
      <text x="381.2" y="123.2">Mouad Mouji</text>
      <text x="380.8" y="122.8">Mouad Mouji</text>
      <text x="380.4" y="122.4">Mouad Mouji</text>
    </g>
    <text x="380" y="122" font-size="58" font-weight="800" text-anchor="middle"
          fill="url(#frontGrad)" stroke="#bfe6ff" stroke-width="1" paint-order="stroke">
      Mouad Mouji
    </text>
    <text x="380" y="122" font-size="58" font-weight="800" text-anchor="middle"
          fill="url(#shineGrad)" style="mix-blend-mode:overlay">
      Mouad Mouji
    </text>
  </g>
</svg>
